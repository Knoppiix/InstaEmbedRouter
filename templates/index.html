<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Instagram embedding proxy</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap">

	<link rel="stylesheet" href="/static/css/tokens.css">
	<link rel="stylesheet" href="/static/css/components.css">
	<link rel="stylesheet" href="/static/css/app.css">

	<!-- defer keeps execution order, so charts.js always runs after Chart.js -->
	<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels" defer></script>
	<script src="/static/js/charts.js" defer></script>
</head>

<body>
	<div class="page">

		<header class="masthead">
			<h1 class="masthead__title">zzinstagram</h1>
			<p class="masthead__sub">Instagram embedding proxy</p>
		</header>

		<section class="status">
			<span class="nb-badge nb-fill-green">
				<span class="nb-badge__dot"></span>
				Online
			</span>
		</section>

		<section class="nb-panel nb-fill-yellow usage">
			<p class="usage__lead">Add <b>zz</b> before instagram.com to fix embeds</p>
			<p class="nb-code">https://<b>zz</b>instagram.com/p/{id}</p>
		</section>

		<section class="charts">
			<figure class="nb-card chart">
				<figcaption class="chart__title">Successful embeds per resolver</figcaption>
				<div class="chart__canvas"><canvas id="successChart"></canvas></div>
			</figure>

			<figure class="nb-card chart">
				<figcaption class="chart__title">Requests over the last 24h</figcaption>
				<div class="chart__canvas"><canvas id="requestsChart"></canvas></div>
			</figure>

			<figure class="nb-card chart">
				<figcaption class="chart__title">Average latency per resolver (last 24h)</figcaption>
				<div class="chart__canvas"><canvas id="latencyChart"></canvas></div>
			</figure>
		</section>

		<footer class="footer">
			<a class="nb-link" href="https://github.com/Knoppiix/InstaEmbedRouter" target="_blank"
				rel="noopener noreferrer">Source on GitHub</a>
		</footer>

	</div>
</body>

</html>
